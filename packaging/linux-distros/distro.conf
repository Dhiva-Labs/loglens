# Package metadata for the Linux distribution packages (.rpm, Arch, AUR
# PKGBUILD). Sourced by bash from packaging/linux-distros/build-tree.sh,
# pack.sh, verify.sh and packaging/arch/aur.sh.

NAME=loglens
APP_NAME=LogLens
GITHUB_REPO=Dhiva-Labs/loglens
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Terminal UI for tailing and analyzing multiple log files live'
DESCRIPTION='LogLens tails several log files at once in one merged terminal view, detects JSON, syslog and nginx formats per file, highlights levels, and offers a live regex filter, an errors-only view that keeps tracebacks attached, buffer search, an error-frequency sparkline, error clustering and export of the filtered view. It follows log rotation by truncation and by rename.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/loglens
LICENSE=MIT
LICENSE_FILE=LICENSE

# Pure Python (the wheel is py3-none-any): one noarch .rpm and one "any" Arch
# package, built once and installed on x86_64 and aarch64. The code lives in
# /usr/share/loglens rather than in a versioned site-packages directory, so
# the same package works with whichever Python 3 the distribution ships.
ARCH_INDEPENDENT=1

# The interpreter and the three runtime dependencies from pyproject.toml,
# from the distribution's own packages (Fedora and openSUSE both provide
# python3-<module> names).
RPM_REQUIRES=(/usr/bin/python3 'python(abi) >= 3.10' 'python3-textual >= 1.0'
  'python3-watchdog >= 4.0' 'python3-click >= 8.1')
ARCH_DEPENDS=(python python-textual python-watchdog python-click)

APPIMAGE=0                   # terminal tool: no AppImage or Flatpak

# Smoke test run in each distribution container by verify.sh: --version, the
# TUI in a pty, and the repository's test suite against the installed copy.
GUI_CMD=''
SMOKE_CMD='bash /linux-distros/smoke.sh'
